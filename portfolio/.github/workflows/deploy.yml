name: Deploy to GitHub Pages

on:
  # Corre automaticamente a cada push para a branch main
  push:
    branches: [main]
  # Permite também correr manualmente no separador "Actions"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Só um deploy de cada vez; um push novo cancela o build anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build and upload site
        uses: withastro/action@v6
        # Domínio próprio? Descomente e coloque o seu domínio
        # (e crie o ficheiro public/CNAME com esse domínio):
        # env:
        #   SITE_URL: https://o-seu-dominio.com

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
